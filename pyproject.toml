[project]
name = "tcc-datasus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "autor@anonimizado" }
]
requires-python = ">=3.12"
dependencies = [
    "datasus-dbc>=0.1.3",
    "dbfread>=2.0.7",
    "duckdb>=1.5.5",
    "joblib>=1.5.3",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pyreaddbc>=2.0.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
tcc-datasus = "tcc_datasus:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "sqlfluff>=4.3.0",
]
